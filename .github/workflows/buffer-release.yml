name: Nuvio Buffer APK Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-buffer-apk:
    if: startsWith(github.event.release.tag_name, 'buffer-') || startsWith(github.event.release.tag_name, 'Buffer-')
    runs-on: ubuntu-latest
    env:
      BUFFER_KEYSTORE_BASE64: ${{ secrets.NUVIO_BUFFER_KEYSTORE_BASE64 }}
      BUFFER_STORE_PASSWORD: ${{ secrets.NUVIO_BUFFER_STORE_PASSWORD }}
      BUFFER_KEY_ALIAS: ${{ secrets.NUVIO_BUFFER_KEY_ALIAS }}
      BUFFER_KEY_PASSWORD: ${{ secrets.NUVIO_BUFFER_KEY_PASSWORD }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Configure Buffer signing
        run: |
          test -n "${BUFFER_KEYSTORE_BASE64}"
          test -n "${BUFFER_STORE_PASSWORD}"
          test -n "${BUFFER_KEY_ALIAS}"
          test -n "${BUFFER_KEY_PASSWORD}"

          keystore_path="${RUNNER_TEMP}/nuvio-buffer.jks"
          printf '%s' "${BUFFER_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          cat > local.properties <<EOF
          NUVIO_RELEASE_STORE_FILE=${keystore_path}
          NUVIO_RELEASE_STORE_PASSWORD=${BUFFER_STORE_PASSWORD}
          NUVIO_RELEASE_KEY_ALIAS=${BUFFER_KEY_ALIAS}
          NUVIO_RELEASE_KEY_PASSWORD=${BUFFER_KEY_PASSWORD}
          EOF

      - name: Build Buffer APK
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleFullBuffer             -Pnuvio.android.distribution=full             --stacktrace

      - name: Locate and rename APK
        run: |
          APK="$(find androidApp/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "${APK}"
          cp "${APK}" "Nuvio-Enhanced-Buffer.apk"
          echo "Built: ${APK}"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}"             Nuvio-Enhanced-Buffer.apk             --repo "${{ github.repository }}"             --clobber
